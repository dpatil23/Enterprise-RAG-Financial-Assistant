name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:community
        env:
          NEO4J_AUTH: neo4j/ragproject123
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('rag-api/requirements.txt') }}

    - name: Install dependencies
      working-directory: ./rag-api
      run: pip install -r requirements.txt

    - name: Run Pytest Suite
      working-directory: ./rag-api
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        NEO4J_URI: bolt://localhost:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: ragproject123
      run: pytest tests/ -v --tb=short

    - name: Validate Docker Image Build
      run: docker build -t enterprise-rag-api:ci ./rag-api
