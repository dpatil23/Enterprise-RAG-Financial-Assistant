services:
  api:
    build:
      context: ./rag-api
      dockerfile: Dockerfile
    container_name: enterprise-rag-api
    ports:
      - "8001:8000"
    env_file:
      - ./rag-api/.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ragproject123
    depends_on:
      - neo4j
    volumes:
      - ./rag-api/chroma_db:/app/chroma_db

  neo4j:
    image: neo4j:community
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/ragproject123
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
